services:
  # ==================== BASE DE DONNÉES (MySQL) ====================
  db:
    image: mysql:8.0
    container_name: nomorewaste_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-nomorewaste}
      MYSQL_USER: ${DB_USER:-nomorewaste}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nomorewaste}
    ports:
      - "${DB_PORT_HOTE:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nomorewaste

  # ==================== API BACKEND (Go) ====================
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: nomorewaste_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-nomorewaste}
      DB_PASSWORD: ${DB_PASSWORD:-nomorewaste}
      DB_NAME: ${DB_NAME:-nomorewaste}
      API_PORT: 8081
      LOGO_PATH: /assets/logo.png
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      SCHEDULER_HEURE: ${SCHEDULER_HEURE:-6}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${API_PORT_HOTE:-8081}:8081"
    volumes:
      - backend_pdfs:/app/storage/pdfs
      - backend_plannings:/app/storage/plannings
    networks:
      - nomorewaste

  # ==================== FRONTEND (PHP + Apache) ====================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: nomorewaste_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8081
      BASE_URL: ""
    ports:
      - "${FRONTEND_PORT_HOTE:-8080}:80"
    networks:
      - nomorewaste

networks:
  nomorewaste:
    driver: bridge

volumes:
  db_data:
  backend_pdfs:
  backend_plannings:
