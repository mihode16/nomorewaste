version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: nomorewaste_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - nomorewaste_network_prod

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: nomorewaste_backend_prod
    restart: always
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      API_PORT: 8080
    networks:
      - nomorewaste_network_prod

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
    container_name: nomorewaste_frontend_prod
    restart: always
    environment:
      API_URL: http://backend:8080
    networks:
      - nomorewaste_network_prod

  nginx:
    image: nginx:alpine
    container_name: nomorewaste_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/usr/share/nginx/html/public:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro # Pour HTTPS
    depends_on:
      - backend
      - frontend
    networks:
      - nomorewaste_network_prod

networks:
  nomorewaste_network_prod:
    driver: bridge

volumes:
  db_data_prod:
