server {
    listen 80;
    server_name theupcycleconnect.fr www.theupcycleconnect.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name theupcycleconnect.fr www.theupcycleconnect.fr;

    ssl_certificate /etc/letsencrypt/live/theupcycleconnect.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theupcycleconnect.fr/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
